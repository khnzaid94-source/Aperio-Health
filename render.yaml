services:
  - type: web
    name: Aperio-Health
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://aperio-health.onrender.com,http://localhost:3000,http://localhost:8000
